<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace;
            padding: 16px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 800px;
            margin: 0 auto;
        }

        h1, h2 {
            font-size: 14px;
            font-weight: normal;
            margin-bottom: 8px;
        }

        .section {
            margin-bottom: 24px;
        }

        .summary-box {
            margin-bottom: 16px;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            border-bottom: 1px dashed #333333;
            padding-bottom: 2px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 120px;
        }

        label {
            font-size: 12px;
            margin-bottom: 2px;
            color: #aaaaaa;
        }

        input, select, button {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #727272;
            font-family: inherit;
            font-size: 14px;
            padding: 6px 8px;
            outline: none;
            border-radius: 0;
        }

        input:focus, select:focus {
            background-color: #111111;
        }

        button {
            cursor: pointer;
            text-align: center;
            background: #000000;
            user-select: none;
        }

        button:hover, button:active {
            background-color: #ffffff;
            color: #000000;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-row {
            display: flex;
            flex-direction: column;
            padding-bottom: 12px;
            border-bottom: 1px solid #222222;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .item-title {
            font-weight: bold;
            word-break: break-all;
        }

        .item-details {
            font-size: 12px;
            color: #888888;
            margin-top: 4px;
        }

        .item-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .timer-display {
            font-size: 13px;
            color: #ffffff;
        }

        .status-tag {
            display: inline-block;
            margin-right: 6px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .form-row {
                flex-direction: column;
            }

            .input-group {
                width: 100%;
            }

            .item-controls {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <div class="section">
        <h1>> item tracker</h1>
        <p style="font-size: 12px; color: #888888; margin-bottom: 16px;">initialized</p>
        
        <div class="summary-box">
            <div class="summary-line">
                <span>total:</span>
                <span id="total-val">€0.00</span>
            </div>
            <div class="summary-line">
                <span>weekly cost:</span>
                <span id="weekly-val">€0.00</span>
            </div>
            <div class="summary-line">
                <span>monthly cost:</span>
                <span id="monthly-val">€0.00</span>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>add new</h2>
        <form id="item-form">
            <div class="input-group">
                <label for="item-name">name</label>
                <input type="text" id="item-name" placeholder="item name" required autocomplete="off">
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label for="item-price">price</label>
                    <input type="number" id="item-price" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <div class="input-group">
                    <label for="item-duration">duration</label>
                    <input type="number" id="item-duration" step="0.1" min="0.01" placeholder="1" required>
                </div>
                <div class="input-group">
                    <label for="item-unit">unit</label>
                    <select id="item-unit">
                        <option value="days">days</option>
                        <option value="hours">hours</option>
                    </select>
                </div>
            </div>
            <button type="submit" style="margin-top: 4px;">add</button>
        </form>
    </div>

    <div class="section">
        <h2>tracked items</h2>
        <div id="item-list" class="item-list">
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'terminal_tracker_items_v1';
        let items = [];

        function loadState() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    items = JSON.parse(stored);
                }
            } catch (e) {
                console.error("error: not loaded", e);
                items = [];
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            } catch (e) {
                console.error("error: not saved", e);
            }
        }

        function calculateCalculatedCosts() {
            let totalNominal = 0;
            let totalWeekly = 0;
            let totalMonthly = 0;

            items.forEach(item => {
                const price = parseFloat(item.price) || 0;
                const duration = parseFloat(item.duration) || 0;
                
                totalNominal += price;

                if (duration > 0) {
                    let durationInHours = item.unit === 'days' ? duration * 24 : duration;
                    
                    const weeklyCost = (price / durationInHours) * 168;
                    const monthlyCost = (price / durationInHours) * 730.5;

                    totalWeekly += weeklyCost;
                    totalMonthly += monthlyCost;
                }
            });

            document.getElementById('total-val').textContent = '€' + totalNominal.toFixed(2);
            document.getElementById('weekly-val').textContent = '€' + totalWeekly.toFixed(2);
            document.getElementById('monthly-val').textContent = '€' + totalMonthly.toFixed(2);
        }

        function formatRemainingTime(ms) {
            if (ms <= 0) return "00:00:00";
            
            let seconds = Math.floor(ms / 1000);
            let minutes = Math.floor(seconds / 60);
            let hours = Math.floor(minutes / 60);
            let days = Math.floor(hours / 24);

            seconds = seconds % 60;
            minutes = minutes % 60;
            hours = hours % 24;

            const pad = (num) => String(num).padStart(2, '0');

            if (days > 0) {
                return `${days}d ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            }
            return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        function updateTimers() {
            const now = Date.now();
            let stateUpdated = false;

            items.forEach((item, index) => {
                if (item.checked && item.startTime) {
                    const durationInMs = (item.unit === 'days' ? item.duration * 24 * 3600 : item.duration * 3600) * 1000;
                    const elapsedTime = now - item.startTime;
                    const remainingTime = durationInMs - elapsedTime;

                    const timerEl = document.getElementById(`timer-${item.id}`);
                    const statusEl = document.getElementById(`status-${item.id}`);

                    if (remainingTime <= 0) {
                        item.checked = false;
                        item.startTime = null;
                        stateUpdated = true;

                        if (timerEl) timerEl.textContent = "expired";
                        if (statusEl) statusEl.textContent = "inactive";
                        
                        renderItems();
                    } else {
                        if (timerEl) {
                            timerEl.textContent = formatRemainingTime(remainingTime);
                        }
                    }
                }
            });

            if (stateUpdated) {
                saveState();
            }
        }

        function renderItems() {
            const listEl = document.getElementById('item-list');
            listEl.innerHTML = '';

            if (items.length === 0) {
                listEl.innerHTML = '<div style="color: #666666; font-size: 12px;">no items.</div>';
                calculateCalculatedCosts();
                return;
            }

            const now = Date.now();

            items.forEach(item => {
                const itemRow = document.createElement('div');
                itemRow.className = 'item-row';

                let remainingText = "offline";
                let statusText = "inactive";

                if (item.checked && item.startTime) {
                    const durationInMs = (item.unit === 'days' ? item.duration * 24 * 3600 : item.duration * 3600) * 1000;
                    const remainingTime = durationInMs - (now - item.startTime);
                    if (remainingTime > 0) {
                        remainingText = formatRemainingTime(remainingTime);
                        statusText = "active";
                    }
                }

                itemRow.innerHTML = `
                    <div class="item-header">
                        <span class="item-title">${escapeHtml(item.name)}</span>
                        <span>€${parseFloat(item.price).toFixed(2)}</span>
                    </div>
                    <div class="item-details">
                        duration: ${item.duration} ${item.unit.toUpperCase()}
                    </div>
                    <div class="item-controls">
                        <button onclick="toggleItem('${item.id}')">
                            ${item.checked ? 'uncheck' : 'check'}
                        </button>
                        <button onclick="deleteItem('${item.id}')">delete</button>
                        <span class="status-tag" id="status-${item.id}">${statusText}</span>
                        <span class="timer-display" id="timer-${item.id}">${item.checked ? remainingText : ''}</span>
                    </div>
                `;

                listEl.appendChild(itemRow);
            });

            calculateCalculatedCosts();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function addItem(name, price, duration, unit) {
            const newItem = {
                id: 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                name,
                price: parseFloat(price),
                duration: parseFloat(duration),
                unit,
                checked: false,
                startTime: null
            };

            items.push(newItem);
            saveState();
            renderItems();
        }

        function toggleItem(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            if (!item.checked) {
                item.checked = true;
                item.startTime = Date.now();
            } else {
                item.checked = false;
                item.startTime = null;
            }

            saveState();
            renderItems();
        }

        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            saveState();
            renderItems();
        }

        document.getElementById('item-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nameEl = document.getElementById('item-name');
            const priceEl = document.getElementById('item-price');
            const durationEl = document.getElementById('item-duration');
            const unitEl = document.getElementById('item-unit');

            if (nameEl.value && priceEl.value && durationEl.value) {
                addItem(nameEl.value, priceEl.value, durationEl.value, unitEl.value);
                
                nameEl.value = '';
                priceEl.value = '';
                durationEl.value = '';
                nameEl.focus();
            }
        });

        window.onload = function() {
            loadState();
            renderItems();
            setInterval(updateTimers, 1000);
        };
    </script>
</body>
</html>
